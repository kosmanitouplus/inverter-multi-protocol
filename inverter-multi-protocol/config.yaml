name: "Multi Onduleur Robuste"
description: "Multi-inverter MQTT monitoring, protocol detection and verified settings"
version: "0.2.2"
slug: "inverter_multi_protocol"
url: https://github.com/kosmanitouplus/inverter-multi-protocol
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
uart: true
usb: true
hassio_api: true
map:
  - config:ro
services:
  - mqtt:want
options:
  inverter_name: "INVERTER_1"
  protocol: "PI30"
  port: "/dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller_FHBSb2A4517-if00-port0"
  poll_interval: 5
  inverters: []
schema:
  inverter_name: str
  protocol: str
  port: str
  poll_interval: int(1,3600)
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_user: str?
  mqtt_password: password?
  inverters:
    - name: str
      port: str
      protocol: str?
      baud: int(1200,115200)?
      poll_interval: float(0.2,3600)?
      query_interval: float(0.2,3600)?
      timeout: float(0.2,10)?
      parity: list(N|E|O)?
      stopbits: int(1,2)?
      unit_id: int(1,247)?
      command_unit: int(0,9)?
      profile: str?
      manufacturer: str?
      allow_writes: bool?
      expose_controls: bool?
      charge_current_command: list(MCHGC|MNCHGC)?
      controls: str?
      write_limits: str?
      commands: str?
